services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hindsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hindsight_dev_password}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hindsight} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      DEBUG: "false"

      # --- Hindsight's own application database ---
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hindsight}:${POSTGRES_PASSWORD:-hindsight_dev_password}@postgres:5432/hindsight_app
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}

      # --- Cognee: entirely on Postgres (db, vectors, graph, cache) ---
      DB_PROVIDER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER:-hindsight}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hindsight_dev_password}
      DB_NAME: cognee_db
      VECTOR_DB_PROVIDER: pgvector
      GRAPH_DATABASE_PROVIDER: postgres
      CACHE_BACKEND: postgres
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in your environment or a .env file}
    ports:
      - "8000:8000"

volumes:
  pgdata:
